# Applies patches/ to FilmCraft (FILMCRAFT_COMMIT) with install.ps1, then checks formatting,
# clippy and the tests of the crates the patches touch. Runs on every push and pull request,
# and by hand from the Actions tab.
name: Verify patches

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # the crates the patches change
  CRATES: -p filmcraft-audio-dsp -p filmcraft-project -p filmcraft-render -p filmcraft-engine -p filmcraft-ui-egui

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Clone FilmCraft and apply the patches
        shell: pwsh
        run: ./install.ps1 -Target ../filmcraft -NoRun

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ../filmcraft

      - name: Format
        working-directory: ../filmcraft
        shell: bash
        run: cargo fmt --check $CRATES

      - name: Clippy
        working-directory: ../filmcraft
        shell: bash
        run: cargo clippy $CRATES --all-targets -- -D warnings

      - name: Tests (0001 Distance & Space)
        working-directory: ../filmcraft
        run: cargo test -p filmcraft-audio-dsp -p filmcraft-project -p filmcraft-render

      - name: Tests (0002 image sequence import)
        working-directory: ../filmcraft
        run: |
          cargo test -p filmcraft-engine --lib project_tools
          cargo test -p filmcraft-ui-egui --lib first_numbered_frame
          cargo test -p filmcraft-ui-egui --test project_panel_ui

      - name: UI translations
        working-directory: ../filmcraft
        run: cargo test -p filmcraft-ui-egui --lib i18n
